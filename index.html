<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://gztuzvckzmcoinqxmlzd.supabase.co https://*.supabase.co data: blob:; connect-src 'self' https://gztuzvckzmcoinqxmlzd.supabase.co https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://gztuzvckzmcoinqxmlzd.supabase.co https://*.supabase.co https://cdn.jsdelivr.net;">
<title>明日之后合成利润计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:rgba(30,42,58,0.85);--accent:#e94560;--accent2:#0f3460;--text:#e0e0e0;--text-dim:#8892a4;--border:rgba(233,69,96,0.3);--success:#2ecc71;--warning:#f39c12;--danger:#e74c3c;--sidebar-w:220px}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
/* Sidebar */
#sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0d1321,#16213e);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
#sidebar.sidebar-raised{z-index:150}
#sidebar .logo{padding:20px;text-align:center;border-bottom:1px solid var(--border)}
#sidebar .logo h2{color:var(--accent);font-size:18px;letter-spacing:1px}
#sidebar .logo p{color:var(--text-dim);font-size:11px;margin-top:4px}
#sidebar nav{flex:1;padding:10px 0}
#sidebar nav .nav-item{display:flex;align-items:center;padding:12px 20px;cursor:pointer;color:var(--text-dim);transition:all .2s;border-left:3px solid transparent;font-size:14px}
#sidebar nav .nav-item:hover{background:rgba(233,69,96,0.1);color:var(--text)}
#sidebar nav .nav-item.active{background:rgba(233,69,96,0.15);color:var(--accent);border-left-color:var(--accent)}
#sidebar nav .nav-item .icon{margin-right:10px;font-size:16px;width:20px;text-align:center}
#sidebar .user-info{padding:15px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim)}
#sidebar .user-info .username{color:var(--accent);font-weight:bold}
/* Main */
#main{margin-left:var(--sidebar-w);flex:1;padding:20px;min-height:100vh}
.page{display:none}
.page.active{display:block}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;backdrop-filter:blur(10px)}
.card h3{color:var(--accent);margin-bottom:15px;font-size:16px;border-bottom:1px solid var(--border);padding-bottom:8px}
/* Form */
.form-group{margin-bottom:15px}
.form-group label{display:block;color:var(--text-dim);font-size:13px;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:rgba(10,14,23,0.8);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
/* Buttons */
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#c73852;transform:translateY(-1px)}
.btn-secondary{background:var(--accent2);color:var(--text)}
.btn-secondary:hover{background:#1a4a7a}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#27ae60}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-warning{background:var(--warning);color:#000}
.btn-warning:hover{background:#e67e22}
.btn-sm{padding:5px 12px;font-size:12px}
/* Table */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
th{color:var(--accent);font-weight:600;background:rgba(233,69,96,0.05)}
tr:hover{background:rgba(233,69,96,0.05)}
/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge-exclusive{background:rgba(233,69,96,0.2);color:var(--accent);border:1px solid var(--accent)}
.badge-profession{background:rgba(15,52,96,0.5);color:#5dade2;border:1px solid #5dade2}
/* Recipe tree */
.recipe-tree{padding-left:20px}
.recipe-node{margin:8px 0;padding:10px 14px;background:rgba(10,14,23,0.6);border-radius:8px;border-left:3px solid var(--accent)}
.recipe-node .name{font-weight:bold;color:var(--text);font-size:14px}
.recipe-node .cost{color:var(--success);font-size:13px;margin-left:8px}
.recipe-node .qty{color:var(--text-dim);font-size:12px}
.recipe-node .children{margin-left:20px;margin-top:8px}
.recipe-node.base{border-left-color:var(--warning)}
.recipe-node.base .name{color:var(--warning)}
/* Login overlay */
#login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
#login-overlay.hidden{display:none}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;width:380px;max-width:90vw;position:relative}
.login-box h2{text-align:center;color:var(--accent);margin-bottom:20px}
.login-box .toggle-mode{text-align:center;margin-top:15px;color:var(--text-dim);font-size:13px}
.login-box .toggle-mode a{color:var(--accent);cursor:pointer;text-decoration:none}
.login-box .error-msg{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;min-height:18px}
/* Close button for login overlay */
.login-close-btn{position:absolute;top:10px;left:10px;font-size:24px;color:var(--text);cursor:pointer;background:none;border:none;padding:0;line-height:1}
.login-close-btn:hover{color:var(--accent)}
/* Profit display */
.profit-positive{color:var(--success)!important;font-weight:bold}
.profit-negative{color:var(--danger)!important;font-weight:bold}
/* Tabs */
.tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.tab-btn{padding:8px 16px;background:rgba(10,14,23,0.8);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:13px;transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Checkbox/Radio groups */
.check-group,.radio-group{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.check-group label,.radio-group label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;color:var(--text);padding:6px 12px;background:rgba(10,14,23,0.6);border-radius:8px;border:1px solid var(--border);transition:all .2s}
.check-group label:hover,.radio-group label:hover{border-color:var(--accent)}
.check-group input:checked+span,.radio-group input:checked+span{color:var(--accent)}
.check-group label:has(input:checked),.radio-group label:has(input:checked){border-color:var(--accent);background:rgba(233,69,96,0.1)}
/* AI Panel */
.ai-panel{background:linear-gradient(135deg,rgba(233,69,96,0.1),rgba(15,52,96,0.2));border:1px solid var(--border);border-radius:12px;padding:20px}
.ai-panel h3{color:var(--accent);display:flex;align-items:center;gap:8px}
.ai-panel .rank-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin:5px 0;background:rgba(10,14,23,0.5);border-radius:8px;font-size:13px}
.ai-panel .rank-num{color:var(--accent);font-weight:bold;width:24px}
.ai-panel .rank-name{flex:1;margin:0 10px}
.ai-panel .rank-profit{font-weight:bold}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
/* Mobile */
#menu-toggle{display:none;position:fixed;top:10px;left:10px;z-index:150;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:18px}
@media(max-width:768px){
#sidebar{transform:translateX(-100%)}
#sidebar.open{transform:translateX(0)}
#main{margin-left:0;padding:15px;padding-top:50px}
#menu-toggle{display:block}
.card{padding:15px}
table{font-size:12px}
th,td{padding:8px}
/* 批量输入价格页面移动端优化 */
.batch-grid{grid-template-columns:1fr !important}
.batch-group h4{font-size:13px !important}
.form-group input{font-size:14px;padding:10px !important}
/* 按钮移动端优化 */
.btn{padding:10px 16px;font-size:14px}
.btn-sm{padding:8px 12px;font-size:12px}
/* 输入框移动端优化 */
input[type="text"],input[type="number"],input[type="password"],select{padding:12px;font-size:14px}
/* 材料汇总移动端优化 */
.material-summary{grid-template-columns:1fr !important}
.material-item{font-size:14px;padding:12px}
/* 配方树移动端优化 */
.recipe-tree{font-size:13px}
}
@media(max-width:480px){
.card{padding:10px}
#main{padding:10px;padding-top:45px}
h2{font-size:18px}
h3{font-size:16px}
.batch-group h4{font-size:12px !important;padding-bottom:6px !important;margin-bottom:8px !important}
.form-group label{font-size:12px}
.form-group input{font-size:13px;padding:8px !important}
.btn{padding:8px 12px;font-size:13px}
.btn-sm{padding:6px 10px;font-size:11px}
}
/* Tax settings compact layout for PC */
.tax-settings-row{display:flex;gap:30px;flex-wrap:wrap}
.tax-settings-row .form-group{flex:1;min-width:200px}
@media(max-width:768px){
.tax-settings-row{flex-direction:column;gap:0}
}
/* Notification */
.toast{position:fixed;top:20px;right:20px;z-index:400;padding:12px 20px;border-radius:10px;color:#fff;font-size:13px;animation:slideIn .3s ease;max-width:350px}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}
.toast.info{background:#3498db}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Materials summary */
.material-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.material-item{padding:10px;background:rgba(10,14,23,0.6);border-radius:8px;border:1px solid var(--border);font-size:13px}
.material-item .mat-name{font-weight:bold;margin-bottom:4px}
.material-item .mat-detail{color:var(--text-dim);font-size:12px}
/* Undo bar */
.undo-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;z-index:350;display:none;align-items:center;gap:10px;font-size:13px;backdrop-filter:blur(10px)}
.undo-bar.show{display:flex}
/* Searchable recipe input */
.recipe-search-wrapper{position:relative}
.recipe-search-input{width:100%;padding:10px 12px;background:rgba(10,14,23,0.8);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.recipe-search-input:focus{border-color:var(--accent)}
.recipe-search-dropdown{position:absolute;top:100%;left:0;right:0;background:rgba(10,14,23,0.95);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:250px;overflow-y:auto;z-index:50;display:none}
.recipe-search-dropdown.show{display:block}
.recipe-search-item{padding:10px 12px;cursor:pointer;font-size:13px;color:var(--text);transition:background .15s;border-bottom:1px solid rgba(255,255,255,0.03)}
.recipe-search-item:hover{background:rgba(233,69,96,0.15)}
.recipe-search-item.selected{background:rgba(233,69,96,0.2);color:var(--accent)}
.recipe-search-item .item-badge{margin-left:6px}
</style>
</head>
<body>

<button id="menu-toggle" onclick="toggleSidebar()">&#9776;</button>

<!-- Login Overlay（默认隐藏，通过导航栏登录按钮触发） -->
<div id="login-overlay" class="hidden">
<div class="login-box">
<button class="login-close-btn" onclick="closeLoginOverlay()">&times;</button>
<h2 id="login-title">登录</h2>
<div class="form-group">
<label>用户名</label>
<input type="text" id="login-username" placeholder="请输入用户名" maxlength="20">
</div>
<div class="form-group">
<label>密码</label>
<input type="password" id="login-password" placeholder="请输入密码" maxlength="50">
</div>
<button class="btn btn-primary" style="width:100%" onclick="handleLogin()" id="login-btn">登录</button>
<div class="error-msg" id="login-error"></div>
<div class="toggle-mode">
<span id="toggle-text">没有账号？</span> <a onclick="toggleLoginMode()" id="toggle-link">注册</a>
</div>
</div>
</div>

<!-- Sidebar -->
<div id="sidebar">
<div class="logo">
<h2>明日之后</h2>
<p>合成利润计算器</p>
</div>
<nav>
<div class="nav-item active" onclick="switchPage('calculator',this)">
<span class="icon">&#128200;</span> 利润计算器
</div>
<div class="nav-item" onclick="switchPage('ai',this)">
<span class="icon">&#129302;</span> AI智能推荐
</div>
<div class="nav-item" onclick="switchPage('batch',this)">
<span class="icon">&#128221;</span> 批量输入价格
</div>
<div class="nav-item" onclick="switchPage('manage',this)" id="nav-manage" style="display:none">
<span class="icon">&#9881;</span> 配方管理
</div>
</nav>
<div class="user-info">
<div>当前用户: <span class="username" id="display-username">离线模式</span></div>
<div style="margin-top:5px;display:flex;gap:10px">
<a onclick="showLoginOverlay()" style="color:var(--accent);cursor:pointer;font-size:12px" id="login-link">登录</a>
<a onclick="handleLogout()" style="color:var(--accent);cursor:pointer;font-size:12px;display:none" id="logout-link">退出登录</a>
</div>
</div>
</div>

<!-- Main Content -->
<div id="main">

<!-- Page 1: Calculator -->
<div class="page active" id="page-calculator">
<h2 style="margin-bottom:20px;color:var(--accent)">利润计算器</h2>

<!-- Tax Settings -->
<div class="card">
<h3>&#128176; 税率设置</h3>
<div class="tax-settings-row">
<div class="form-group">
<label>出售地点</label>
<div class="radio-group" id="tax-location-group">
<label><input type="radio" name="taxLocation" value="0.15" onchange="updateTaxSettings()"> <span>交易之城（15%）</span></label>
<label><input type="radio" name="taxLocation" value="0.18" onchange="updateTaxSettings()"> <span>电视家具（18%）</span></label>
<label><input type="radio" name="taxLocation" value="0.20" checked onchange="updateTaxSettings()"> <span>随身电视（20%）</span></label>
</div>
</div>
<div class="form-group">
<label>月卡</label>
<div class="radio-group" id="monthly-card-group">
<label><input type="radio" name="monthlyCard" value="0.05" checked onchange="updateTaxSettings()"> <span>有月卡</span></label>
<label><input type="radio" name="monthlyCard" value="0" onchange="updateTaxSettings()"> <span>无月卡</span></label>
</div>
</div>
</div>
<div style="margin-top:15px;padding-top:15px;border-top:1px solid var(--border)">
<label class="checkbox-label">
<input type="checkbox" id="apply-profession" onchange="updateTaxSettings()" checked>
<span>应用当前职业（采集材料免费）</span>
</label>
</div>
</div>

<!-- Recipe Selector -->
<div class="card">
<h3>选择配方</h3>
<div class="form-group">
<div class="recipe-search-wrapper">
<input type="text" class="recipe-search-input" id="recipe-search-input" placeholder="输入搜索配方..." autocomplete="off" onfocus="showRecipeDropdown()" oninput="filterRecipes()">
<div class="recipe-search-dropdown" id="recipe-search-dropdown"></div>
</div>
</div>
<div class="form-group" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
<div style="flex:1;min-width:150px">
<label>售价 (金条)</label>
<input type="number" id="sell-price" placeholder="输入售价" min="0" step="0.1" oninput="recalcAll()">
</div>
<div style="flex:1;min-width:150px">
<label>制作数量</label>
<input type="number" id="craft-qty" value="1" min="1" step="1" oninput="recalcAll()">
</div>
</div>
<!-- Profit Display -->
<div id="profit-display" style="display:none;margin-top:15px;padding:15px;background:rgba(10,14,23,0.6);border-radius:10px;border:1px solid var(--border)">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
<div><span style="color:var(--text-dim)">材料总成本:</span> <span id="total-cost" style="color:var(--warning);font-weight:bold">0</span></div>
<div><span style="color:var(--text-dim)">税后收入:</span> <span id="net-income" style="color:var(--text)">0</span></div>
<div><span style="color:var(--text-dim)">净利润:</span> <span id="net-profit" class="profit-positive">0</span></div>
<div><span style="color:var(--text-dim)">利润率:</span> <span id="profit-rate" class="profit-positive">0%</span></div>
</div>
</div>
</div>

<!-- Recipe Tree -->
<div class="card" id="recipe-tree-card" style="display:none">
<h3 id="recipe-tree-title">配方树</h3>
<div id="recipe-tree"></div>
</div>

<!-- Materials Summary -->
<div class="card" id="materials-summary-card" style="display:none">
<h3>所需材料汇总</h3>
<div class="material-summary" id="materials-summary"></div>
</div>
</div>

<!-- Page 2: AI Recommendations (includes profession selector) -->
<div class="page" id="page-ai">
<h2 style="margin-bottom:20px;color:var(--accent)">AI智能推荐</h2>

<!-- Unified Profession Card -->
<div class="card">
<h3>&#127891; 选择职业</h3>
<div class="radio-group" id="profession-group-ai">
<label><input type="radio" name="currentProfAI" value="伐木工" onchange="updateProfessionsAI()"> <span>&#129488; 伐木工</span></label>
<label><input type="radio" name="currentProfAI" value="挖矿工" onchange="updateProfessionsAI()"> <span>&#9874;&#65039; 挖矿工</span></label>
<label><input type="radio" name="currentProfAI" value="采麻工" onchange="updateProfessionsAI()"> <span>&#127807; 采麻工</span></label>
<label><input type="radio" name="currentProfAI" value="工匠" onchange="updateProfessionsAI()"> <span>&#128296; 工匠</span></label>
<label><input type="radio" name="currentProfAI" value="枪械工" onchange="updateProfessionsAI()"> <span>&#128299; 枪械工</span></label>
<label><input type="radio" name="currentProfAI" value="护甲工" onchange="updateProfessionsAI()"> <span>&#128737;&#65039; 护甲工</span></label>
<label><input type="radio" name="currentProfAI" value="家具工" onchange="updateProfessionsAI()"> <span>&#129681; 家具工</span></label>
<label><input type="radio" name="currentProfAI" value="战斗职业" onchange="updateProfessionsAI()"> <span>&#9876;&#65039; 战斗职业</span></label>
</div>

<!-- AI Smart Recommendation -->
<div class="ai-panel" style="margin-top:20px">
<h3>&#129302; AI 智能推荐</h3>
<div id="ai-recommendations" style="margin-top:15px">
<p style="color:var(--text-dim);font-size:13px">请先选择当前职业，系统将为您推荐最优配方</p>
</div>
</div>
</div>
</div>

<!-- Page 3: Batch Price Input -->
<div class="page" id="page-batch">
<h2 style="margin-bottom:20px;color:var(--accent)">批量输入价格</h2>
<!-- 隐藏的文件导入字段 -->
<input type="file" id="import-file" accept=".json" style="display:none" onchange="importUserData(event)">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px">
<h3 style="border:none;margin:0;padding:0">基础材料价格</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-success btn-sm" onclick="saveBatchPrices()">&#128190; 保存到本地</button>
<button class="btn btn-primary btn-sm" onclick="exportUserData()">📥 导出数据</button>
<button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-file').click()">📤 导入数据</button>
<button class="btn btn-danger btn-sm" onclick="clearBatchPrices()">&#128465; 清空价格</button>
</div>
</div>
<div id="batch-price-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px"></div>
</div>
</div>

<!-- Page 4: Recipe Management -->
<div class="page" id="page-manage">
<h2 style="margin-bottom:20px;color:var(--accent)">配方管理 (管理员)</h2>
<div class="card">
<h3>添加配方</h3>
<div class="form-group">
<label>配方名称</label>
<input type="text" id="new-recipe-name" placeholder="输入配方名称" maxlength="30">
</div>
<div class="form-group">
<label>所需材料 (JSON格式: {"材料名": 数量, ...})</label>
<textarea id="new-recipe-materials" rows="4" placeholder='例如: {"铁矿": 2, "小树枝": 4}'></textarea>
</div>
<div class="form-group">
<label>专属制作职业 (可选)</label>

function savePendingSync() {

  savePendingSync();
  showSyncIndicator();
}

function removeFromPendingSync(keys) {
  keys.forEach(key => delete pendingSync[key]);
  savePendingSync();
  showSyncIndicator();
}

function showSyncIndicator() {
  const pendingCount = Object.keys(pendingSync).length;
  const indicator = document.getElementById('sync-indicator');

    indicator.textContent = '(' + pendingCount + ')';

function checkNetworkStatus() {
  isOnline = navigator.onLine;
  if (isOnline && currentUser && Object.keys(pendingSync).length > 0) {
    syncPendingPrices();
  }
}

async function syncPendingPrices() {
  if (!currentUser || Object.keys(pendingSync).length === 0) return;
  
  showToast('正在同步价格到云端...', 'info');
  
  try {
    const result = await supabaseSavePrices({ ...materialPrices, ...pendingSync });
    if (result.error) {
      showToast('同步失败，将在网络恢复后重试', 'warning');
      return;
    }
    
    removeFromPendingSync(Object.keys(pendingSync));
    showToast('价格已同步到云端', 'success');
  } catch (e) {
    showToast('同步失败，将在网络恢复后重试', 'warning');
  }
}

// ==================== UTILITY FUNCTIONS ====================
function escapeHtml(str) {
if (typeof str !== 'string') return '';
const div = document.createElement('div');
div.textContent = str;
return div.innerHTML;
}

function showToast(msg, type = 'success') {
const toast = document.createElement('div');
toast.className = 'toast ' + type;
toast.textContent = msg;
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 3000);
}

async function sha256(message) {
const msgBuffer = new TextEncoder().encode(message);
const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
const hashArray = Array.from(new Uint8Array(hashBuffer));
return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function validateInput(input, type = 'text') {
if (type === 'text') {
return typeof input === 'string' && input.length > 0 && input.length <= 100;
}
if (type === 'number') {
return !isNaN(input) && Number(input) >= 0;
}
if (type === 'username') {
return typeof input === 'string' && input.length >= 2 && input.length <= 20 && /^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(input);
}
if (type === 'password') {
return typeof input === 'string' && input.length >= 4 && input.length <= 50;
}
return false;
}

async function handleLogin() {
try {
const now = Date.now();
if (now < lockoutUntil) {
const remaining = Math.ceil((lockoutUntil - now) / 60000);
document.getElementById('login-error').textContent = '登录已锁定，请' + remaining + '分钟后再试';
return;
}

const username = document.getElementById('login-username').value.trim();
const password = document.getElementById('login-password').value;

if (!validateInput(username, 'username')) {
document.getElementById('login-error').textContent = '用户名需2-20字符，支持中英文、数字、下划线';
return;
}
if (!validateInput(password, 'password')) {
document.getElementById('login-error').textContent = '密码需4-50字符';
return;
}

console.log('Attempting login:', { username, isLoginMode });

if (isLoginMode) {
// 使用本地用户系统登录
const result = await localSignIn(username, password);
if (result.error) {
loginAttempts++;
if (loginAttempts >= MAX_LOGIN_ATTEMPTS) {
lockoutUntil = now + LOCKOUT_DURATION;
loginAttempts = 0;
document.getElementById('login-error').textContent = '尝试次数过多，已锁定5分钟';
} else {
document.getElementById('login-error').textContent = result.error + ' (' + loginAttempts + '/' + MAX_LOGIN_ATTEMPTS + ')';
}
return;
}
loginAttempts = 0;
lockoutUntil = 0;
await finishLocalLogin(username, result.data.user.role);
} else {
// 使用本地用户系统注册
const result = await localSignUp(username, password);
if (result.error) {
document.getElementById('login-error').textContent = result.error;
return;
}
showToast('注册成功！', 'success');
await finishLocalLogin(username, result.data.user.role);
}
} catch (e) {
console.error('Login error:', e);
document.getElementById('login-error').textContent = '登录过程中发生错误: ' + e.message;
}
}

'樟木': 20, '升麻': 15, '升麻茎': 15
};

const CAMP_MATERIAL_PRICES = {
// 家具店
'石灰': 60, '砂岩': 80, '花岗岩': 72, '玻璃': 90, '钢筋': 300, '石英砂': 360, '流纹岩': 600,

// 武器店
'胶水': 48, '钉子': 72, '钨棒': 90, '玻璃纤维': 300, '生橡胶': 360, '高强钢': 600
};

function initCampMaterialPrices() {
for (const [name, price] of Object.entries(CAMP_MATERIAL_PRICES)) {
materialPrices[name] = price;
}
}

function calcCampContributionCost(recipeName, visited) {
visited = visited || new Set();
if (visited.has(recipeName)) return 0;
visited.add(recipeName);

const recipe = recipes[recipeName];
if (!recipe || !recipe.materials || Object.keys(recipe.materials).length === 0) {
// 如果是营地商人材料，返回其价格
if (FIXED_PRICE_MATERIALS.has(recipeName)) {
return (materialPrices[recipeName] || CAMP_MATERIAL_PRICES[recipeName] || 0);
}
return 0;
}

let total = 0;
for (const [mat, qty] of Object.entries(recipe.materials)) {
if (recipes[mat] && Object.keys(recipes[mat].materials).length > 0) {
total += calcCampContributionCost(mat, new Set(visited)) * qty;
} else {
if (FIXED_PRICE_MATERIALS.has(mat)) {
total += (materialPrices[mat] || CAMP_MATERIAL_PRICES[mat] || 0) * qty;
}
}
}
return total;
}

function getMaterialCost(name) {
const info = MATERIAL_INFO[name];
// 固定价格材料（营地商人）不计入金币成本，单独计算营地贡献
if (FIXED_PRICE_MATERIALS.has(name)) {
return 0;
}
// 检查是否应用当前职业
const applyProfession = document.getElementById('apply-profession')?.checked ?? true;
if (applyProfession && info && getGatheringProfessions().includes(info.profession)) {
return 0;
}
// 返回价格，优先使用用户设置的价格，否则使用默认价格
return materialPrices[name] || DEFAULT_PRICES[name] || 0;
}

function isCraftingExclusive(recipeName) {
for (const prof of Object.keys(CRAFTING_EXCLUSIVES)) {
if (CRAFTING_EXCLUSIVES[prof].includes(recipeName)) {
return prof;
}
}
return null;
}

function canCraft(recipeName) {
const exclusive = isCraftingExclusive(recipeName);
if (!exclusive) return true;
const cp = getCraftingProfession();
if (cp === '无') return false;
const profRecipes = CRAFTING_EXCLUSIVES[cp];
return profRecipes && profRecipes.includes(recipeName);
}

// ==================== COST CALCULATION ====================
function calcRecipeCost(recipeName, visited) {
visited = visited || new Set();
if (visited.has(recipeName)) return 0;
visited.add(recipeName);

const recipe = recipes[recipeName];
if (!recipe || !recipe.materials || Object.keys(recipe.materials).length === 0) {
return getMaterialCost(recipeName);
}

let totalCost = 0;
for (const [mat, qty] of Object.entries(recipe.materials)) {
if (recipes[mat] && Object.keys(recipes[mat].materials).length > 0) {
totalCost += calcRecipeCost(mat, new Set(visited)) * qty;
} else {
totalCost += getMaterialCost(mat) * qty;
}
}
return totalCost;
}

function getBaseMaterials(recipeName, visited) {
visited = visited || new Set();
if (visited.has(recipeName)) return {};
visited.add(recipeName);

const recipe = recipes[recipeName];
if (!recipe || !recipe.materials || Object.keys(recipe.materials).length === 0) {
const cost = getMaterialCost(recipeName);
return { [recipeName]: { qty: 1, cost, totalCost: cost } };
}

const result = {};
for (const [mat, qty] of Object.entries(recipe.materials)) {
if (recipes[mat] && Object.keys(recipes[mat].materials).length > 0) {
const sub = getBaseMaterials(mat, new Set(visited));
for (const [name, info] of Object.entries(sub)) {
if (result[name]) {
result[name].qty += info.qty * qty;
} else {
result[name] = { qty: info.qty * qty, cost: info.cost, totalCost: info.totalCost * qty };
}
}
} else {
const cost = getMaterialCost(mat);
if (result[mat]) {
result[mat].qty += qty;
result[mat].totalCost = result[mat].qty * cost;
} else {
result[mat] = { qty, cost, totalCost: cost * qty };
}
}
}
return result;
}

function renderRecipeTree(recipeName, visited, depth) {
visited = visited || new Set();
depth = depth || 0;
if (visited.has(recipeName)) return '';
visited.add(recipeName);

const recipe = recipes[recipeName];
if (!recipe || !recipe.materials || Object.keys(recipe.materials).length === 0) {
const info = MATERIAL_INFO[recipeName];
const applyProfession = document.getElementById('apply-profession')?.checked ?? true;
const isFree = applyProfession && info && getGatheringProfessions().includes(info.profession);
const isFixedPrice = FIXED_PRICE_MATERIALS.has(recipeName);

let profBadge = '';
if (isFixedPrice) {
profBadge = '<span class="badge" style="background:rgba(15,52,96,0.5);color:#5dade2;border:1px solid #5dade2;font-size:10px">营地商人</span>';
} else if (applyProfession && info && info.profession !== '其他职业') {
profBadge = '<span class="badge badge-exclusive">' + escapeHtml(info.profession) + '</span>';
}

const freeBadge = isFree ? '<span class="badge" style="background:rgba(46,204,113,0.2);color:#2ecc71;border:1px solid #2ecc71">免费</span>' : '';
const price = isFixedPrice ? (materialPrices[recipeName] || CAMP_MATERIAL_PRICES[recipeName] || 0) : (materialPrices[recipeName] || DEFAULT_PRICES[recipeName] || 0);
const priceUnit = isFixedPrice ? '营地贡献' : '金';
return '<div class="recipe-node base" style="margin-left:' + (depth * 20) + 'px">' +
'<span class="name">' + escapeHtml(recipeName) + '</span> ' +
'<span class="qty">x1</span> ' +
profBadge + ' ' + freeBadge + ' ' +
'<span class="cost">' + (isFree ? '免费' : price + priceUnit) + '</span>' +
'</div>';
}

const exclusive = isCraftingExclusive(recipeName);
const exclusiveBadge = exclusive ? '<span class="badge badge-profession">' + escapeHtml(exclusive) + '专属</span>' : '';
const cost = calcRecipeCost(recipeName);
const campCost = calcCampContributionCost(recipeName);
const campCostDisplay = campCost > 0 ? '<span style="color:#f39c12;margin-left:8px">' + campCost.toFixed(0) + '营地贡献</span>' : '';

let html = '<div class="recipe-node" style="margin-left:' + (depth * 20) + 'px">' +
'<span class="name">' + escapeHtml(recipeName) + '</span> ' +
exclusiveBadge + ' ' +
'<span class="cost">成本: ' + cost.toFixed(2) + '金' + campCostDisplay + '</span>' +
'<div class="children">';

// 对材料进行排序：营地商人材料沉底
const sortedMaterials = Object.entries(recipe.materials).sort((a, b) => {
const isAFixed = FIXED_PRICE_MATERIALS.has(a[0]);
const isBFixed = FIXED_PRICE_MATERIALS.has(b[0]);
if (isAFixed && !isBFixed) return 1;
if (!isAFixed && isBFixed) return -1;
return 0;
});

for (const [mat, qty] of sortedMaterials) {
const isMatFixedPrice = FIXED_PRICE_MATERIALS.has(mat);
const matPrice = isMatFixedPrice ? (materialPrices[mat] || CAMP_MATERIAL_PRICES[mat] || 0) : (materialPrices[mat] || DEFAULT_PRICES[mat] || 0);
const matInfo = MATERIAL_INFO[mat];
const applyProfession = document.getElementById('apply-profession')?.checked ?? true;
const isMatFree = applyProfession && matInfo && getGatheringProfessions().includes(matInfo.profession);
const matUnit = isMatFixedPrice ? '营地贡献' : '金';
const matCost = isMatFree ? 0 : matPrice * qty;
html += '<div class="recipe-node" style="margin-left:' + ((depth + 1) * 20) + 'px">' +
'<span class="name">' + escapeHtml(mat) + '</span> ' +
'<span class="qty">x' + qty + '</span> ' +
'<span class="price" style="color:#f39c12;font-size:12px">' + (isMatFree ? '免费' : matPrice + matUnit + '/个') + '</span> ' +
'<span class="subtotal" style="color:#9b59b6;font-size:12px">合计: ' + matCost + matUnit + '</span>' +
'</div>';

const subRecipe = recipes[mat];
if (subRecipe && subRecipe.materials && Object.keys(subRecipe.materials).length > 0) {
html += '<div class="children">';
html += renderRecipeTree(mat, new Set(visited), depth + 2);
html += '</div>';
}
}

html += '</div></div>';
return html;
}

function recalcAll() {
const recipeName = selectedRecipeName;
if (!recipeName) {
document.getElementById('recipe-tree-card').style.display = 'none';
document.getElementById('materials-summary-card').style.display = 'none';
document.getElementById('profit-display').style.display = 'none';
return;
}

const sellPrice = parseFloat(document.getElementById('sell-price').value) || 0;
const craftQty = parseInt(document.getElementById('craft-qty').value) || 1;
const effectiveTax = getEffectiveTax();

const unitCost = calcRecipeCost(recipeName);
const totalCost = unitCost * craftQty;
const totalSell = sellPrice * craftQty;
const tax = totalSell * effectiveTax;
const netIncome = totalSell - tax;
const netProfit = netIncome - totalCost;
const profitRate = totalCost > 0 ? (netProfit / totalCost * 100) : 0;

document.getElementById('profit-display').style.display = 'block';
document.getElementById('total-cost').textContent = totalCost.toFixed(2) + ' 金';
document.getElementById('net-income').textContent = netIncome.toFixed(2) + ' 金';

document.getElementById('materials-summary-card').style.display = 'block';
let summaryHtml = '';

for (const [name, info] of sortedMats) {

const isFixedPrice = FIXED_PRICE_MATERIALS.has(name);

let profBadge = '';
if (isFixedPrice) {
profBadge = '<span class="badge" style="background:rgba(15,52,96,0.5);color:#5dade2;border:1px solid #5dade2;font-size:10px">营地商人</span>';
} else if (applyProfession && matInfo && matInfo.profession !== '其他职业') {
profBadge = '<span class="badge badge-exclusive" style="font-size:10px">' + escapeHtml(matInfo.profession) + '</span>';
}

const freeBadge = isFree ? '<span class="badge" style="background:rgba(46,204,113,0.2);color:#2ecc71;border:1px solid #2ecc71;font-size:10px">免费</span>' : '';
const priceUnit = isFixedPrice ? '营地贡献' : '金';
summaryHtml += '<div class="material-item">' +
'<div class="mat-name">' + escapeHtml(name) + ' ' + profBadge + ' ' + freeBadge + '</div>' +
'<div class="mat-detail">数量: ' + info.qty + ' | 单价: ' + (isFree ? '免费' : info.cost + priceUnit) + ' | 小计: ' + (isFree ? '免费' : info.totalCost.toFixed(2) + priceUnit) + '</div>' +
'</div>';

document.getElementById('materials-summary').innerHTML = summaryHtml;
}

// ==================== AI RECOMMENDATIONS ====================
function updateAIRecommendations() {
const container = document.getElementById('ai-recommendations');
const gp = getGatheringProfessions();
const cp = getCraftingProfession();

// 获取当前税率设置
const locationRadios = document.querySelectorAll('input[name="sell-location"]');
let currentTaxRate = 0.15;
locationRadios.forEach(r => { if (r.checked) currentTaxRate = parseFloat(r.value); });
const cardRadios = document.querySelectorAll('input[name="has-card"]');
let hasCard = true;
cardRadios.forEach(r => { if (r.checked) hasCard = r.value === 'yes'; });
// 有月卡时直接减去5%的税率
const effectiveTax = hasCard ? Math.max(0, currentTaxRate - 0.05) : currentTaxRate;
const taxLabel = (effectiveTax * 100).toFixed(0) + '%';

// 获取所有有价格的配方
const allRecipes = Object.keys(recipes);
let recommendations = [];

allRecipes.forEach(name => {
const recipe = recipes[name];
if (!recipe.materials || Object.keys(recipe.materials).length === 0) return;

const cost = calcRecipeCost(name);

// 检查是否有材料价格（用于计算利润）
const baseMats = getBaseMaterials(name);
let hasAnyPrice = false;
let freeMats = 0;
let totalMatValue = 0;
let paidMats = 0;

for (const [mat, info] of Object.entries(baseMats)) {
const matCost = getMaterialCost(mat);
if (matCost > 0) hasAnyPrice = true;
totalMatValue += info.totalCost;

const matInfo = MATERIAL_INFO[mat];
if (matInfo && gp.includes(matInfo.profession)) {
freeMats++;
} else {
paidMats++;
}
}

if (!hasAnyPrice && freeMats === 0) return;

// 判断是否为制作职业专属
let isExclusive = false;
let exclusiveProf = '';
if (cp !== '无' && CRAFTING_EXCLUSIVES[cp] && CRAFTING_EXCLUSIVES[cp].includes(name)) {
isExclusive = true;
exclusiveProf = cp;
}

// 判断是否可免费获得所有材料
const allFree = freeMats === Object.keys(baseMats).length && freeMats > 0;

recommendations.push({
name, cost, freeMats, paidMats, totalMatValue,
hasAnyPrice, isExclusive, exclusiveProf, allFree,
totalMats: Object.keys(baseMats).length
});
});

// 排序：有价格的按利润排序，无价格的按成本排序
recommendations.sort((a, b) => {
// 有完整价格的优先
if (a.hasAnyPrice && !b.hasAnyPrice) return -1;
if (!a.hasAnyPrice && b.hasAnyPrice) return 1;
// 全免费的优先
if (a.allFree && !b.allFree) return -1;
if (!a.allFree && b.allFree) return 1;
// 专属的优先
if (a.isExclusive && !b.isExclusive) return -1;
if (!a.isExclusive && b.isExclusive) return 1;
// 按成本从低到高
return a.cost - b.cost;
});

recommendations = recommendations.slice(0, 20);

if (recommendations.length === 0) {
container.innerHTML = '<p style="color:var(--text-dim);font-size:13px">请先在"批量输入价格"中设置材料价格，然后选择职业查看推荐</p>';
return;
}

let html = '';

// 分组1：可低成本合成的配方（超过一半材料免费获取）
const freeRecipes = recommendations.filter(r => r.freeMats >= Math.floor((r.totalMats + 1) / 2));
if (freeRecipes.length > 0) {
html += '<div style="margin-bottom:20px">';
html += '<h4 style="color:#2ecc71;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px">✅ 可低成本合成（超过一半材料免费获取）</h4>';
html += '<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px">利润 = 售价 × (1 - ' + taxLabel + '税率) - 材料成本</div>';
freeRecipes.forEach((item, idx) => {
html += '<div class="rank-item" style="border-left:3px solid #2ecc71">';
html += '<span class="rank-num">' + (idx + 1) + '</span>';
html += '<span class="rank-name">' + escapeHtml(item.name);
if (item.isExclusive) html += ' <span class="badge badge-exclusive">' + escapeHtml(item.exclusiveProf) + '专属</span>';
html += '</span>';
html += '<div style="text-align:right">';
html += '<div class="rank-profit" style="color:#2ecc71">成本 ' + item.cost.toFixed(0) + ' 金</div>';
html += '<div style="font-size:10px;color:var(--text-dim)">' + item.freeMats + '/' + item.totalMats + '材料免费</div>';
html += '</div></div>';
});
html += '</div>';
}

// 分组2：部分材料免费的配方
const partialFree = recommendations.filter(r => !r.allFree && r.freeMats > 0 && r.hasAnyPrice);
if (partialFree.length > 0) {
html += '<div style="margin-bottom:20px">';
html += '<div style="color:#f39c12;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px">⚡ 部分材料免费（需购买部分材料）</div>';
html += '<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px">利润 = 售价 × (1 - ' + taxLabel + '税率) - 材料成本</div>';
partialFree.forEach((item, idx) => {
const freeRatio = Math.round(item.freeMats / item.totalMats * 100);
html += '<div class="rank-item" style="border-left:3px solid #f39c12">';
html += '<span class="rank-num">' + (idx + 1) + '</span>';
html += '<span class="rank-name">' + escapeHtml(item.name);
if (item.isExclusive) html += ' <span class="badge badge-exclusive">' + escapeHtml(item.exclusiveProf) + '专属</span>';
html += '</span>';
html += '<div style="text-align:right">';
html += '<div class="rank-profit" style="color:#f39c12">成本 ' + item.cost.toFixed(0) + ' 金</div>';
html += '<div style="font-size:10px;color:var(--text-dim)">' + freeRatio + '%材料免费</div>';
html += '</div></div>';
});
html += '</div>';
}

// 分组3：需要购买所有材料的配方（有价格数据）
const paidRecipes = recommendations.filter(r => !r.allFree && r.freeMats === 0 && r.hasAnyPrice);
if (paidRecipes.length > 0) {
html += '<div style="margin-bottom:20px">';
html += '<div style="color:#5dade2;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px">💰 全部材料需购买</div>';
html += '<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px">利润 = 售价 × (1 - ' + taxLabel + '税率) - 材料成本</div>';
paidRecipes.forEach((item, idx) => {
html += '<div class="rank-item" style="border-left:3px solid #5dade2">';
html += '<span class="rank-num">' + (idx + 1) + '</span>';
html += '<span class="rank-name">' + escapeHtml(item.name);
if (item.isExclusive) html += ' <span class="badge badge-exclusive">' + escapeHtml(item.exclusiveProf) + '专属</span>';
html += '</span>';
html += '<span class="rank-profit" style="color:#5dade2">成本 ' + item.cost.toFixed(0) + ' 金</span>';
html += '</div>';
});
html += '</div>';
}

// 分组4：无价格数据的配方
const noPrice = recommendations.filter(r => !r.hasAnyPrice && !r.allFree);
if (noPrice.length > 0) {
html += '<div style="margin-bottom:20px">';
html += '<div style="color:var(--text-dim);font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px">📋 待设置价格</div>';
html += '<div style="color:var(--text-dim);font-size:11px;margin-bottom:8px">请在"批量输入价格"中设置材料价格后查看利润</div>';
noPrice.forEach((item, idx) => {
html += '<div class="rank-item" style="border-left:3px solid #555;opacity:0.6">';
html += '<span class="rank-num">' + (idx + 1) + '</span>';
html += '<span class="rank-name">' + escapeHtml(item.name);
if (item.isExclusive) html += ' <span class="badge badge-exclusive">' + escapeHtml(item.exclusiveProf) + '专属</span>';
html += '</span>';
html += '<span class="rank-profit" style="color:var(--text-dim)">未设置价格</span>';
html += '</div>';
});
html += '</div>';
}

container.innerHTML = html;
}

// ==================== RECIPE MANAGEMENT ====================
function renderRecipeList() {
const tbody = document.getElementById('recipe-list');
if (!tbody) return;
let html = '';
const sorted = Object.keys(recipes).sort();
sorted.forEach(name => {
const recipe = recipes[name];
const mats = recipe.materials ? Object.entries(recipe.materials).map(([k, v]) => escapeHtml(k) + 'x' + v).join(', ') : '无';
const exclusive = isCraftingExclusive(name);
const exclusiveBadge = exclusive ? '<span class="badge badge-profession">' + escapeHtml(exclusive) + '</span>' : '';
const isPlaceholder = !recipe.materials || Object.keys(recipe.materials).length === 0;
const placeholderBadge = isPlaceholder ? '<span class="badge" style="background:rgba(243,156,18,0.2);color:#f39c12;border:1px solid #f39c12">待填充</span>' : '';
html += '<tr>' +
'<td>' + escapeHtml(name) + ' ' + exclusiveBadge + ' ' + placeholderBadge + '</td>' +
'<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(mats) + '</td>' +
'<td>' + (exclusive || '无') + '</td>' +
'<td><button class="btn btn-danger btn-sm" onclick="deleteRecipe(\'' + escapeHtml(name).replace(/'/g, "\\'") + '\')">删除</button></td>' +
'</tr>';
});
tbody.innerHTML = html;
}

function addRecipe() {
if (!isAdmin) {
showToast('仅管理员可操作', 'error');
return;
}
const client = getSupabase();
if (!client) {
showToast('Supabase未加载，无法操作', 'error');
return;
}
const name = document.getElementById('new-recipe-name').value.trim();
const materialsStr = document.getElementById('new-recipe-materials').value.trim();
const craftProf = document.getElementById('new-recipe-craft-prof').value;

if (!validateInput(name, 'text')) {
showToast('请输入有效的配方名称', 'error');
return;
}

let materials = {};
if (materialsStr) {
try {
materials = JSON.parse(materialsStr);
if (typeof materials !== 'object' || Array.isArray(materials)) {
throw new Error('Invalid format');
}
// Validate all values are positive numbers
for (const [k, v] of Object.entries(materials)) {
if (typeof v !== 'number' || v <= 0) {
throw new Error('Invalid quantity for ' + k);
}
}
} catch (e) {
showToast('材料格式错误，请使用JSON格式', 'error');
return;
}
}

showToast('正在写入云端配方…', 'info');
// 管理员写入必须走 Edge Function（服务端），这里仅发起请求
client.functions.invoke(ADMIN_FN_UPSERT_RECIPE, { body: { name, materials, craftProf } })
.then(async (resp) => {
if (resp.error) {
showToast('云端写入失败：' + resp.error.message, 'error');
return;
}

// If crafting profession exclusive, update the mapping (仅用于前端展示/校验)
if (craftProf && CRAFTING_EXCLUSIVES[craftProf]) {
if (!CRAFTING_EXCLUSIVES[craftProf].includes(name)) {
CRAFTING_EXCLUSIVES[craftProf].push(name);
}
}

await loadRecipes();
renderRecipeList();
document.getElementById('new-recipe-name').value = '';
document.getElementById('new-recipe-materials').value = '';
document.getElementById('new-recipe-craft-prof').value = '';
showToast('配方已写入云端', 'success');
})
.catch((e) => {
showToast('云端写入失败：' + e.message, 'error');
});

}

function deleteRecipe(name) {
if (!isAdmin) {
showToast('仅管理员可操作', 'error');
return;
}
const client = getSupabase();
if (!client) {
showToast('Supabase未加载，无法操作', 'error');
return;
}
if (!confirm('确定要删除配方 "' + name + '" 吗？')) return;

showToast('正在删除云端配方…', 'info');
client.functions.invoke(ADMIN_FN_DELETE_RECIPE, { body: { name } })
.then(async (resp) => {
if (resp.error) {
showToast('云端删除失败：' + resp.error.message, 'error');
return;
}
await loadRecipes();
renderRecipeList();
showToast('云端配方已删除', 'success');
})
.catch((e) => {
showToast('云端删除失败：' + e.message, 'error');
});
}

// ==================== NAVIGATION ====================
function switchPage(pageId, navItem) {
document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
document.getElementById('page-' + pageId).classList.add('active');
if (navItem) navItem.classList.add('active');
// Close sidebar on mobile
if (window.innerWidth <= 768) {
document.getElementById('sidebar').classList.remove('open');
}
}

function toggleSidebar() {
document.getElementById('sidebar').classList.toggle('open');
}
